[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engrava"
version = "0.6.0"
description = "The memory database for AI agents — graph memory, hybrid search, tamper-evident thought/edge journal."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Sovantica", email = "hello@sovantica.ai"}]
keywords = [
    "ai-agents", "agent-memory", "graph-memory", "hybrid-search",
    "memory-consolidation", "audit-trail", "sqlite", "llm",
    "autonomous-agents", "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.11.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0,<2.3",  # cap: numpy >=2.3 ships PEP 695 `type` stubs that break mypy --strict at the 3.11 target
    "click>=8.1.0",
    "PyYAML>=6.0",
]

[project.scripts]
engrava = "engrava.cli.main:main"

[project.urls]
Homepage = "https://engrava.ai"
Documentation = "https://docs.engrava.ai/"
Repository = "https://github.com/sovantica/engrava"
Issues = "https://github.com/sovantica/engrava/issues"
Changelog = "https://github.com/sovantica/engrava/blob/main/CHANGELOG.md"

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.0,<0.2.0"]
embeddings-local = ["sentence-transformers>=3.0.0", "torch>=2.0.0"]
embeddings-openai = ["httpx>=0.27.0"]
embeddings-ollama = ["httpx>=0.27.0"]
embeddings-hf = ["huggingface_hub>=0.24.0"]
dev = [
    # These four floors were measured, not assumed: installing the latest of
    # each (pytest 9.1.1, pytest-asyncio 1.4.0, pytest-cov 7.1.0, mypy 2.3.1)
    # against this commit reported zero new failures and zero new
    # ``mypy --strict`` findings across the test suite and ``src/``. Unlike
    # ruff below, none of these gains checks merely by existing at a newer
    # version, so an unpinned floor costs nothing measured today and stays.
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    # Pinned exactly, unlike the floors above, because ``select = ["ALL"]``
    # opts into every rule ruff ships, including ones still in preview — and
    # a preview rule stabilizing turns the gate red without a line of this
    # project changing. This is not hypothetical: the 0.15.20 -> 0.16.8
    # upgrade alone stabilized five such rules and surfaced 283 findings
    # under this project's scope, none of which existed in the pinned
    # version's report. Measured directly against the alternative (see the
    # floors above): none of the other dev tools reproduced this failure
    # mode at their current latest, so the exposure is ruff-specific rather
    # than a reason to pin everything. Bump deliberately, not as a "dated
    # measure" — each bump is its own controlled upgrade: run
    # ``ruff check --select ALL``, dispose of every new finding, then move
    # the pin.
    "ruff==0.16.8",
    "types-PyYAML>=6.0",
    # Synthetic benchmark suite needs a real embedding provider in CI
    # to exercise the OFF/ON evaluator path.  Pinned to the same
    # version range as the ``embeddings-local`` extra so both
    # extras resolve together (``pip install -e .[dev,embeddings-local]``
    # used to fail with a resolver conflict before this alignment).
    # ``sentence-transformers`` pulls torch transitively (~500 MB). CI caches
    # both the pip download (``cache: pip``) and the HuggingFace model store
    # (``actions/cache`` on ``~/.cache/huggingface``), so this cost is paid once
    # and the model-loading tests do not re-hit the Hub (avoids HF 429).
    "sentence-transformers>=3.0.0",
    # Install the optional sqlite-vec extension in the test environment so
    # CI actually exercises the real extension-load path: the worker-thread
    # load and KNN search over the compact vec0 table — faster brute-force KNN,
    # not ANN at the pinned 0.1.x line — not just the numpy fallback.  Mirrors
    # the constraint declared in the ``vec`` extra above.
    "sqlite-vec>=0.1.0,<0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engrava = [
    "infrastructure/sqlite/*.sql",
    "benchmarks/synthetic/datasets/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "D107",
    "TC001",
    "PLR0913",
    # The project carries a root LICENSE (MIT) and has never used per-file
    # copyright headers; every source file in the tree is already covered by
    # it. Adding a header to the ~250 files this flags would document nothing
    # a `git log` doesn't already answer more precisely (author, date), for a
    # project with a single copyright holder. Cost of ignoring: a future file
    # added under a different holder (e.g. a first outside contributor's
    # copyright-assigned file) would not be flagged for a header either --
    # that case is caught at PR review, not by this gate, and re-litigating
    # the header policy the day it matters is cheaper than 250 headers today.
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "SLF001", "PT011", "B017", "FBT", "PLC0415", "ARG001", "ARG002"]
"examples/**" = ["T201", "INP001", "D"]
"scripts/**" = ["INP001", "T201", "ASYNC240"]
# Both scripts import from tests/ (not an installed package), so they must
# insert the repository root onto sys.path before that import can resolve --
# the import cannot be moved above the sys.path mutation it depends on.
# Scoped to these two files, not scripts/** as a whole: every other script
# here is a genuine top-of-file-import script, and a directory-wide E402
# ignore would stop catching a real ordering mistake in any of them.
"scripts/build_upgrade_fixture.py" = ["E402"]
"scripts/regenerate_search_goldens.py" = ["E402"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_reexport = true
# Type-check assuming Python 3.11 floor (matches requires-python).
# Prevents accidental 3.12-only syntax (PEP 695, PEP 701) leaking into a
# package whose pyproject claims to install on 3.11. Devs still get 3.12
# locally via .python-version=3.12; CI matrix covers 3.11/3.12/3.13.
python_version = "3.11"

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlite_vec.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "huggingface_hub.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# An unhandled exception on a worker thread, or an exception raised where
# nothing can propagate it (e.g. inside `__del__`), is a resource-lifecycle
# bug even when the test using that thread still passes on its own assertions
# -- pytest only warns by default, so such a bug can sit in a green suite
# indefinitely. Promote both to hard failures instead.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
# Measure coverage of the package only. Without this, a bare ``--cov`` (as the
# CI gate runs it) instruments the whole repository — including ``tests/`` and
# ``scripts/`` — which inflates the denominator: those trees sit near 100%, so
# the aggregate can read comfortably above the 90% gate while ``src/engrava``
# itself sits below it. Scoping the source here keeps the local and CI ``--cov``
# invocations measuring exactly the same thing, so there is a single source of
# truth and the ``--cov-fail-under=90`` floor guards the package, not the repo.
source = ["src/engrava"]
# Branch coverage in addition to line coverage, so a critical-path branch that
# is never taken (e.g. only the happy side of a lifecycle/transaction guard)
# cannot hide behind a line that is merely executed once for either outcome.
# Does not raise the existing --cov-fail-under=90 floor, which stays a
# line-coverage gate; this only makes branch data available to it and to
# --cov-report.
branch = true

[tool.coverage.report]
# No blanket excludes. Coverage's built-in default already omits the narrow,
# individually-justified ``# pragma: no cover`` defensive lines in the source
# (see ``infrastructure/sqlite/engrava_core.py``); this section deliberately
# does not set ``exclude_lines`` so that default stays in force, and adds no
# broader exclusion. ``show_missing`` surfaces the uncovered lines so a gate
# failure names the exact spots to test.
show_missing = true
