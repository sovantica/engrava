name: Upgrade Path Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        from-spec: ["engrava==0.2.2"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run upgrade smoke test
        env:
          ENGRAVA_RUN_UPGRADE_MATRIX: "1"
          ENGRAVA_UPGRADE_FROM_SPEC: ${{ matrix.from-spec }}
          ENGRAVA_UPGRADE_TO_SPEC: .
          ENGRAVA_UPGRADE_FROM_EDITABLE: "0"
          ENGRAVA_UPGRADE_TO_EDITABLE: "1"
        run: pytest tests/upgrade/test_upgrade_matrix.py -v