name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy --strict src/

  goldens:
    name: Search goldens drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      # The search-semantics goldens are checked in and only regenerated by an
      # explicit command. Fail if they are stale relative to the current code so
      # a normalizer/ranking change that forgets to regenerate cannot ship
      # silently. Fully deterministic and offline (bag-of-words vector arm; no
      # model, no network), so no HuggingFace cache is needed here.
      - name: Check search goldens are up to date
        run: python scripts/regenerate_search_goldens.py --check

  dependency-audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      # Install the package NON-editable so pip-audit can resolve and audit the
      # engrava distribution itself. An editable install (`-e`) builds an
      # `*.editable` wheel that pip-audit reports as a SkippedDependency, and
      # `--strict` hard-fails on ANY skip ("distribution marked as editable").
      # A plain `pip install .` produces a normal, auditable distribution, so
      # --strict still fails on a real CVE or collection failure — without
      # tripping on the self-package.
      - name: Install package
        run: |
          # Upgrade pip first: pip-audit --strict audits the whole environment,
          # including pip itself, and the runner image can ship a pip with a
          # freshly disclosed CVE (e.g. PYSEC-2026-196 in pip 26.1.1). Upgrading
          # to the latest pip clears it for real rather than ignoring the finding.
          python -m pip install --upgrade pip
          pip install .
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict

  # Warm the HuggingFace model cache exactly once before the test matrix.
  # The benchmark tests load a real sentence-transformers model
  # (all-MiniLM-L6-v2) on purpose. If the matrix legs each populated the cache
  # themselves, a cold cache means all three legs miss and download the model
  # concurrently — tripping HF rate limiting (HTTP 429), and if every leg fails
  # the cache is never saved. This single upstream job does at most one download
  # per cold workflow run, saves the shared cache, and the matrix (which `needs`
  # it) then restores a warm cache and runs fully offline.
  warm-hf-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Restore/Save HuggingFace cache
        id: hf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2-v1
      - name: Download model on cache miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        # Only the minimal stack needed to fetch + load the model. This is the
        # single, serialized download for the whole workflow on a cold cache.
        run: |
          pip install "sentence-transformers>=3.0.0"
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

  # End-to-end pip-install upgrade validation: install the last released
  # engrava from PyPI, populate a database with it, then upgrade in place to the
  # current working tree and assert data + core CLI commands still work. Unlike
  # the offline `test` matrix this job MUST reach the network (it pip-installs a
  # released wheel from PyPI into a throwaway venv), so it is scoped to only the
  # upgrade suite and sets the opt-in gate the test keeps for local runs.
  #
  # ENGRAVA_UPGRADE_FROM_SPEC pins the previous release; bump it on every
  # release so the job always exercises the real previous-release -> HEAD path
  # (e.g. 0.5.0 ships schema 18, HEAD ships schema 20, so this run drives the
  # v18 -> v20 migration through a genuine reinstall).
  upgrade-matrix:
    name: Upgrade matrix (last released -> current)
    runs-on: ubuntu-latest
    # This job's regression mode is a hang rather than a red run: it drives
    # aiosqlite connections, whose worker runs on a non-daemon thread, so a
    # failure escaping before close() blocks the interpreter at shutdown and an
    # uncapped job would burn the six-hour default.
    #
    # The fixture's own connections close in finally: blocks, but that does not
    # cover everything this job runs. It also invokes the engrava CLI, which
    # opens connections on paths that are not equally guarded: a corrupt or
    # unreadable database can still hang the `snapshot`, `gc` and `migrate`
    # commands this job runs. Repairing that is a source change, tracked
    # separately and deliberately not made here. Until it lands, this cap is the
    # backstop, and it is what turns such a hang into a failure instead of a
    # stalled run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run upgrade matrix
        env:
          ENGRAVA_RUN_UPGRADE_MATRIX: "1"
          ENGRAVA_UPGRADE_FROM_SPEC: "engrava==0.5.0"
          ENGRAVA_UPGRADE_TO_SPEC: "."
        run: pytest tests/upgrade/test_upgrade_matrix.py -q

  test:
    needs: warm-hf-cache
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      # Restore the cache warmed by `warm-hf-cache`. After warming this is a hit
      # on every matrix leg, so the tests run offline and make no Hub request.
      - name: Restore HuggingFace models
        id: hf-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2-v1
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          # Force offline only on a cache hit (the warm-hf-cache job populates it
          # first, so legs hit). A defensive '0' on a miss lets a leg self-heal
          # by downloading rather than hard-failing — but the warm job makes a
          # miss here unexpected.
          HF_HUB_OFFLINE: ${{ steps.hf-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ steps.hf-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: pytest --cov --cov-fail-under=90 -q
