name: Smoke Gate

# Runs the pre-publish benchmark smoke gate on demand (and on changes to the
# dreaming / benchmark surface), so the release floors can be verified without
# cutting a release tag. This is the same check the publish workflow runs
# before building — running it here surfaces a floor breach early.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/engrava/extensions/**"
      - "src/engrava/benchmarks/**"
      - "scripts/check_smoke_gate.py"

permissions:
  contents: read

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with embeddings extra
        run: pip install -e ".[embeddings-local]"

      - name: Run pre-publish smoke gate
        # Same committed floors as the publish path
        # (scripts/check_smoke_gate.py). A breach fails the run.
        run: python scripts/check_smoke_gate.py
