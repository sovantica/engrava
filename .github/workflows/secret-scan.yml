name: Secret scanning

# Generic secret detection (gitleaks, built-in rule set). Catches accidental
# commits of API keys, tokens, .env files, private keys, etc. from any
# contributor. Uses only gitleaks' built-in patterns — no project-specific
# rules — so this workflow reveals nothing about internal naming or structure.
#
# gitleaks is run from its official release binary in a plain `run:` step rather
# than via the gitleaks-action: this repository's Actions policy allows only
# GitHub-owned (actions/*) and verified-publisher actions, and the gitleaks
# action is neither. scripts/install_gitleaks.sh pins the binary by version +
# SHA-256 and is the ONLY place that pin is declared — release.yml's release
# gate (scripts/verify_release_content_scan.sh) installs gitleaks the same
# way, so there is one trusted binary in this repository, not two that could
# silently drift apart.
#
# release/** is included on both triggers so a release branch is scanned for
# its whole life, not just at the moment it lands on dev. The release pipeline
# tags and publishes to PyPI from the same push to dev that first triggers this
# workflow there, and that publish is not gated on this scan finishing (see
# release.yml) — so a leak first caught on that push is caught beside a publish
# that has already started, not before it. Scanning release/** as the branch
# accumulates commits surfaces a finding while it is still local and
# correctable, ahead of the push that starts the irreversible step.

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev, "release/**"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the scan covers the whole reachable commit range,
          # not just the tip — a secret introduced in any commit is caught.
          fetch-depth: 0

      - name: Install gitleaks (pinned binary, checksum-verified)
        run: bash scripts/install_gitleaks.sh

      - name: Scan repository history
        run: |
          set -euo pipefail
          # `git` mode scans the commit history; exit code 1 = leaks found.
          ./gitleaks git . --redact --verbose --exit-code 1
