# Commitlint config — enforces Conventional Commits 1.0.0 + engrava scope allowlist.
# Reference: https://commitlint.js.org/
# Used by .github/workflows/commitlint.yml to validate PR titles + commits.
# Scope list synced with docs/scopes.md (human-readable version).

extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - perf
      - docs
      - style
      - refactor
      - test
      - build
      - ci
      - chore
      - revert

  scope-enum:
    - 2
    - always
    - - core
      - domain
      - infra
      - dreaming
      - search
      - embedding
      - mindql
      - storage
      - extensions
      - cli
      - config
      - docs
      - bench
      - deps
      - release
      - ci
      - build

  scope-empty:
    - 1      # warning only — some commits (e.g. pure `chore:`) may omit scope
    - never

  header-max-length:
    - 2
    - always
    - 100

  subject-full-stop:
    - 2
    - never
    - "."

  body-leading-blank:
    - 2
    - always

  footer-leading-blank:
    - 2
    - always

  type-empty:
    - 2
    - never

  subject-empty:
    - 2
    - never
